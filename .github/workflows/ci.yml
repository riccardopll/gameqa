name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package:smoke

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: docker/setup-buildx-action@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/browser-runner/Dockerfile
          load: true
          tags: gameqa-browser-runner:e2e
          cache-from: type=gha,scope=browser-runner-e2e
          cache-to: type=gha,mode=max,scope=browser-runner-e2e

      - run: pnpm test:e2e:run
